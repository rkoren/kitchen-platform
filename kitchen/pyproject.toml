[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rkoren-kitchen"
version = "2.0.0a1"
description = "A small CLI harness AI agents work inside for ML competitions: record runs, score honestly, gate promotion"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "rkoren", email = "167029178+rkoren@users.noreply.github.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/rkoren/kitchen-platform"

[project.scripts]
kitchen = "kitchen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kitchen"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rkoren-recipes"
version = "0.2.0"
description = "YAML spec -> Terraform config generator and provisioner for AWS resources"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "rkoren", email = "167029178+rkoren@users.noreply.github.com"},
]
keywords = ["terraform", "iac", "aws", "infrastructure-as-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/rkoren/kitchen-platform"

[project.scripts]
recipes = "recipes.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/recipes"]
